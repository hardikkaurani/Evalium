services:
  - type: web
    name: evalforge-backend
    runtime: docker
    dockerfilePath: docker/backend.Dockerfile
    dockerContext: .
    healthCheckPath: /health
    envVars:
      - key: APP_ENV
        value: production
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: CORS_ORIGINS
        value: '["https://evalforge.onrender.com", "https://eval-forge-sandy.vercel.app", "https://evalforge.vercel.app", "https://app.evalforge.dev"]'
      - key: ALLOWED_HOSTS
        value: '["*"]'
      - key: DATABASE_URL
        sync: false
      - key: REDIS_URL
        fromService:
          type: redis
          name: evalforge-redis
          property: connectionString

  - type: redis
    name: evalforge-redis
    ipAllowList: []
    plan: free
